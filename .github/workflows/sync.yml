name: Sync crDroid 15.0

on:
  workflow_dispatch:     # Manual trigger
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout forked repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Git config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/crdroidandroid/android_vendor_crdroid.git
          git fetch upstream 15.0
          git fetch origin 15.0

      - name: Compare upstream and origin
        id: check
        run: |
          upstream_hash=$(git rev-parse upstream/15.0)
          origin_hash=$(git rev-parse origin/15.0)
          echo "Upstream: $upstream_hash"
          echo "Origin: $origin_hash"
          if [ "$upstream_hash" != "$origin_hash" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge and Push if needed
        if: steps.check.outputs.has_changes == 'true'
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git checkout -B 15.0 origin/15.0
          git merge upstream/15.0 --no-edit || {
            echo "❌ Merge conflict detected. Please resolve it manually.";
            exit 1;
          }
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git 15.0
