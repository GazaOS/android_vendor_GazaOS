name: Sync Fork with Upstream (crDroid 15.0)

on:
  workflow_dispatch:     # Manual run
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the forked repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/crdroidandroid/android_vendor_crdroid.git
          git fetch upstream 15.0

      - name: Compare commits
        id: check
        run: |
          git fetch origin 15.0
          upstream_hash=$(git rev-parse upstream/15.0)
          origin_hash=$(git rev-parse origin/15.0)
          echo "Upstream: $upstream_hash"
          echo "Origin: $origin_hash"
          if [ "$upstream_hash" != "$origin_hash" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge and push changes
        if: steps.check.outputs.has_changes == 'true'
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git checkout 15.0
          git merge upstream/15.0 --no-edit || true
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git 15.0
